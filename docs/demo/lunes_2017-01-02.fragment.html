<script>
(() => {
  const root = document.getElementById('tmf3-lunes-demo');
  const data = JSON.parse(document.getElementById('tmf3-demo-data').textContent);
  const pageSize = 10;
  const policyButtons = root.querySelectorAll('[data-policy]');
  const historicalInput = root.querySelector('#tmf3-historical');
  const previousButton = root.querySelector('#tmf3-previous');
  const nextButton = root.querySelector('#tmf3-next');
  let policy = 'global';
  let historical = false;
  let page = 0;

  function signed(value) {
    return value > 0 ? '+' + value : value < 0 ? '−' + Math.abs(value) : '0';
  }

  function render() {
    const current = data.policies[policy];
    const baseline = data.policies.global;
    policyButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.policy === policy)));
    historicalInput.checked = historical;
    root.querySelector('#tmf3-allocation').innerHTML = current.totals.map((hotel, index) =>
      '<tr><th scope="row">' + hotel.hotel + '</th><td class="text-end">' + hotel.calls +
      '</td><td class="text-end" data-historical>' + hotel.tp + '</td><td class="text-end" data-historical>' +
      signed(hotel.tp - baseline.totals[index].tp) + '</td></tr>'
    ).join('');
    root.querySelector('#tmf3-total').innerHTML = '<tr><th scope="row">Total</th><td class="text-end">' + data.capacity +
      '</td><td class="text-end" data-historical>' + current.tp + '</td><td class="text-end" data-historical>' +
      signed(current.tp - baseline.tp) + '</td></tr>';
    root.querySelector('#tmf3-list-context').textContent = policy === 'global'
      ? '66 reservas solo en la lista global · 9 cancelaciones posteriores'
      : '66 reservas solo en el reparto por hotel · 5 cancelaciones posteriores';
    if (!historical) {
      root.querySelector('#tmf3-list-context').textContent = policy === 'global'
        ? '66 reservas solo en la lista global'
        : '66 reservas solo en el reparto por hotel';
    }
    page = Math.max(0, Math.min(page, Math.ceil(current.movers.length / pageSize) - 1));
    const offset = page * pageSize;
    const visible = current.movers.slice(offset, offset + pageSize);
    root.querySelector('#tmf3-call-list').innerHTML = visible.map(row => {
      const arrival = row.arrival.slice(8, 10) + '/' + row.arrival.slice(5, 7);
      return '<tr><td>' + row.id + '</td><td>' + row.hotel + '</td><td>' + arrival +
        '</td><td class="text-end">' + row.score.toFixed(3).replace('.', ',') +
        '</td><td data-historical>' + (row.canceled ? 'Se canceló' : 'Sin cancelación') + '</td></tr>';
    }).join('');
    root.querySelectorAll('[data-historical]').forEach(element => { element.hidden = !historical; });
    root.querySelector('#tmf3-page-label').textContent = (offset + 1) + '–' + (offset + visible.length) + ' de ' + current.movers.length + ' reservas';
    previousButton.disabled = page === 0;
    nextButton.disabled = offset + pageSize >= current.movers.length;
  }

  function save() {
    if (window.openai && window.openai.setWidgetState) {
      Promise.resolve(window.openai.setWidgetState({
        modelContent: { fecha: data.date, politica: policy, desenlacesHistoricos: historical },
        privateContent: { page }
      })).catch(() => {});
    }
  }

  function restore(saved) {
    const content = saved && saved.modelContent;
    const detail = saved && saved.privateContent;
    if (content && Object.hasOwn(data.policies, content.politica)) policy = content.politica;
    if (content && typeof content.desenlacesHistoricos === 'boolean') historical = content.desenlacesHistoricos;
    if (detail && Number.isInteger(detail.page)) page = detail.page;
    render();
  }

  policyButtons.forEach(button => button.addEventListener('click', () => {
    policy = button.dataset.policy;
    page = 0;
    render();
    save();
  }));
  historicalInput.addEventListener('change', () => {
    historical = historicalInput.checked;
    render();
    save();
  });
  previousButton.addEventListener('click', () => { page -= 1; render(); save(); });
  nextButton.addEventListener('click', () => { page += 1; render(); save(); });
  window.addEventListener('openai:set_globals', event => {
    const globals = event.detail && event.detail.globals;
    if (globals && Object.hasOwn(globals, 'widgetState')) restore(globals.widgetState);
  });
  restore(window.openai && window.openai.widgetState);
})();
</script>
